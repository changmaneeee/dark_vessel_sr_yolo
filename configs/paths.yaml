# AIS-SAT-PIPELINE 경로 설정

# 프로젝트 루트
root_dir: "."

# ★★★ 실제 데이터셋 경로 ★★★
data:
  # HR 데이터 (원본 해상도)
  hr:
    root: "/home/changmin/smart_airbus_data"
    train_images: "/home/changmin/smart_airbus_data/images/train"
    train_labels: "/home/changmin/smart_airbus_data/labels/train"
    val_images: "/home/changmin/smart_airbus_data/images/val"
    val_labels: "/home/changmin/smart_airbus_data/labels/val"
    data_yaml: "/home/changmin/smart_airbus_data/data.yaml"
  
  # LR 데이터 (저해상도)
  lr:
    root: "/home/changmin/smart_airbus_data_lr"
    train_images: "/home/changmin/smart_airbus_data_lr/images/train"
    train_labels: "/home/changmin/smart_airbus_data_lr/labels/train"
    val_images: "/home/changmin/smart_airbus_data_lr/images/val"
    val_labels: "/home/changmin/smart_airbus_data_lr/labels/val"
    data_yaml: "/home/changmin/smart_airbus_data_lr/data.yaml"

# 사전 학습 모델 가중치
pretrained:
  # SR 모델
  rfdn: "weights/rfdn/model_best.pt"
  mamba_sr: "pretrained/sr/mamba_sr_x4.pth"
  ttst: "pretrained/sr/ttst_x4.pth"

  # YOLO 모델
  yolov8n: "yolov8n.pt"
  yolov8s: "weights/yolohr/8s/best.pt"
  yolov8m: "pretrained/detection/yolov8m.pt"

# 학습 결과물
outputs:
  checkpoints: "checkpoints"
  logs: "logs"
  tensorboard: "logs/tensorboard"
  eval_results: "results/eval"
  visualizations: "results/visualizations"
  inference_results: "results/inference"

# 분석 결과
analysis:
  ship_size_distribution: "analysis/ship_sizes.json"
  performance_metrics: "analysis/metrics"