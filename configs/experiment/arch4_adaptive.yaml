# Architecture 4: Confidence-Adaptive Pipeline (Dual YOLO)

defaults:
  - ../default.yaml
  
data:
  hr_root: "/home/jovyan/changmin/cv_ship_detact/datas/smart_airbus_dataset"
  hr_val_images: "/home/jovyan/changmin/cv_ship_detact/datas/smart_airbus_dataset/images/val"
  hr_val_labels: "/home/jovyan/changmin/cv_ship_detact/datas/smart_airbus_dataset/labels/val"
    
  lr_root: "/home/jovyan/changmin/cv_ship_detact/datas/smart_airbus_dataset_lr"
  lr_val_images: "/home/jovyan/changmin/cv_ship_detact/datas/smart_airbus_dataset_lr/images/val"
  lr_val_labels: "/home/jovyan/changmin/cv_ship_detact/datas/smart_airbus_dataset_lr/labels/val"
    
  scale_factor: 4
  upscale_factor: 4

experiment:
  name: "arch4_confidence_adaptive"
  description: "Confidence-based adaptive SR application with Dual YOLO"
  architecture: "arch4"

model:
  pipeline: "arch4_adaptive"
  sr_type: "rfdn"
  detector: "yolov8s"

  # ★★★ Weights 경로 (Dual YOLO 지원) ★★★
  weights:
    sr_model: "/home/jovyan/changmin/rfdn_model/experiment/rfdn_smart_airbus_final_fix/model/model_best.pt"
    # 기존 단일 detector 호환용
    detector: "/home/jovyan/changmin/yolov8s+HR_airbus_smartdata/weights/best.pt"

  # ★★★ YOLO 설정 (Dual YOLO) ★★★
  yolo:
    # HR용 YOLO - Pass2 (SR 이미지 탐지)
    weights_path: "/home/jovyan/changmin/yolov8s+HR_airbus_smartdata/weights/best.pt"
    # LR용 YOLO - Pass1 (LR upsampled 이미지 탐지)
    weights_path_lr: "/home/jovyan/changmin/yolov8s+airbus_smartdata/weights/best.pt"
    num_classes: 1

  # ★★★ RFDN 설정 ★★★
  rfdn:
    nf: 50
    num_modules: 4
    input_range: "0-255"

  # ★★★ Adaptive 설정 ★★★
  adaptive:
    low_conf_threshold: 0.15    # 이 이하면 confident negative
    high_conf_threshold: 0.45   # 이 이상이면 confident positive
    merge_iou_threshold: 0.5    # Pass1/Pass2 결과 병합 시 NMS IoU
  
  # 기존 arch4 설정 (호환성)
  arch4:
    lr_conf_threshold: 0.3
    lr_iou_threshold: 0.45
    adaptive_strategy: "confidence"
    sr_trigger_conf: 0.5
    sr_trigger_size: 0.02
    refinement_mode: "roi"
    roi_expansion: 1.5
    hr_conf_threshold: 0.25
    hr_iou_threshold: 0.45

training:
  epochs: 300
  batch_size: 6

  phases:
    - name: "pretrain_components"
      epochs: 50
      freeze_detector: true
      loss_weights:
        sr_alpha: 0.8
        det_beta: 0.2

    - name: "joint_adaptive"
      epochs: 200
      freeze_detector: false
      loss_weights:
        sr_alpha: 0.4
        det_beta: 0.6
        adaptive_loss: 0.1

    - name: "finetune"
      epochs: 50
      loss_weights:
        sr_alpha: 0.2
        det_beta: 0.8
        adaptive_loss: 0.0

losses:
  adaptive_decision:
    type: "binary_cross_entropy"
    weight: 0.1
    target: "fn_reduction"

  selective_sr_loss:
    type: "l1"
    weight: 0.7
    apply_on: "sr_regions"

evaluation:
  analyze_adaptive_decisions: true
  adaptive_analysis:
    save_decision_maps: true
    count_sr_applications: true
    measure_fn_reduction: true

  metrics:
    - "mAP@0.5"
    - "Recall"
    - "Precision"
    - "F1"
    - "SR_Application_Rate"
    - "Latency_Avg"

  fn_analysis:
    size_bins: [0, 15, 30, 50, 100]
    analyze_missed_ships: true

#expected_performance:
#  pros:
#    - "FN 최소화 (small ships)"
#    - "Adaptive latency (필요시만 SR)"
#    - "연산 효율성"
