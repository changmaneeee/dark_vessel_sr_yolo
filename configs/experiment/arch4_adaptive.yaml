# Architecture 4: Confidence-Adaptive Pipeline

defaults:
  - ../default.yaml

data:
  hr_root: "/home/changmin/smart_airbus_data"
  hr_val_images: "/home/changmin/smart_airbus_data/images/val"
  hr_val_labels: "/home/changmin/smart_airbus_data/labels/val"
    
  lr_root: "/home/changmin/smart_airbus_data_lr"
  lr_val_images: "/home/changmin/smart_airbus_data_lr/images/val"
  lr_val_labels: "/home/changmin/smart_airbus_data_lr/labels/val"
    
  scale_factor: 4

experiment:
  name: "arch4_confidence_adaptive"
  description: "Confidence-based adaptive SR application"
  architecture: "arch4"

model:
  pipeline: "arch4_adaptive"
  sr_model: "rfdn"
  detector: "yolov8n"

  # ★★★ Weights 경로 명시 ★★★
  weights:
    sr_model: "weights/rfdn/model_best.pt"
    detector: "weights/yolohr/8s/best.pt"

  # ★★★ SR 설정 (0-255 범위) ★★★
  sr_config:
    input_range: "0-255"
    nf: 50
    scale: 4

  # Adaptive 메커니즘
  arch4:
    lr_conf_threshold: 0.3
    lr_iou_threshold: 0.45
    adaptive_strategy: "confidence"
    sr_trigger_conf: 0.5
    sr_trigger_size: 0.02
    refinement_mode: "roi"
    roi_expansion: 1.5
    hr_conf_threshold: 0.25
    hr_iou_threshold: 0.45

training:
  epochs: 300
  batch_size: 6

  phases:
    - name: "pretrain_components"
      epochs: 50
      freeze_detector: true
      loss_weights:
        sr_alpha: 0.8
        det_beta: 0.2

    - name: "joint_adaptive"
      epochs: 200
      freeze_detector: false
      loss_weights:
        sr_alpha: 0.4
        det_beta: 0.6
        adaptive_loss: 0.1

    - name: "finetune"
      epochs: 50
      loss_weights:
        sr_alpha: 0.2
        det_beta: 0.8
        adaptive_loss: 0.0

losses:
  adaptive_decision:
    type: "binary_cross_entropy"
    weight: 0.1
    target: "fn_reduction"

  selective_sr_loss:
    type: "l1"
    weight: 0.7
    apply_on: "sr_regions"

evaluation:
  analyze_adaptive_decisions: true
  adaptive_analysis:
    save_decision_maps: true
    count_sr_applications: true
    measure_fn_reduction: true

  metrics:
    - "mAP@0.5"
    - "Recall"
    - "Precision"
    - "F1"
    - "SR_Application_Rate"
    - "Latency_Avg"

  fn_analysis:
    size_bins: [0, 15, 30, 50, 100]
    analyze_missed_ships: true

expected_performance:
  pros:
    - "FN 최소화 (small ships)"
    - "Adaptive latency (필요시만 SR)"
    - "연산 효율성"

  cons:
    - "2-pass 오버헤드"
    - "복잡한 학습 전략"
    - "Threshold 튜닝 필요"

  target_metrics:
    recall: 0.85
    sr_application_rate: 0.3
    latency_avg_ms: 90

