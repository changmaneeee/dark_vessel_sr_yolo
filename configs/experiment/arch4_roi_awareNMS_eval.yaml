# =============================================================================
# Arch4 ROI-aware NMS Configuration (EVAL MODE)
# -----------------------------------------------------------------------------
# 목적:
# - Arch4의 기존 adaptive pipeline에 ROI-aware hierarchical NMS를 추가한 실험용 설정
# - 평가용이므로 final_conf를 낮게 두어 recall / FN 경향을 보기 좋게 함
# - 실제 경로가 다르면 아래 weights 경로만 수정해서 사용
# =============================================================================

data:
  hr_root: "/home/changmin/smart_airbus_data"
  hr_val_images: "images/val"
  hr_val_labels: "labels/val"

  lr_root: "/home/changmin/smart_airbus_data_lr"
  lr_val_images: "images/val"

  upscale_factor: 4

model:
  sr:
    type: "rfdn"
    weights: "/home/changmin/dark_vessel_sr_yolo/weights/rfdn/model_best.pt"
    rfdn:
      nf: 50
      num_modules: 4

  yolo:
    # Scout: LR detector
    weights_lr: "/home/changmin/yolov8s+airbus_smartdata/weights/best.pt"
    # Sniper: HR detector
    weights_hr: "/home/changmin/yolov8s+HR_airbus_smartdata/weights/best.pt"
    classes: 1

  arch4:
    # -------------------------------------------------------------------------
    # 기본 Arch4 detection thresholds
    # -------------------------------------------------------------------------
    pass1_conf: 0.0075     # Scout가 "의심 후보"를 꺼내는 기준
    high_conf: 0.45        # 이보다 높으면 Scout 결과를 바로 확정(A급)
    sniper_conf: 0.001     # Sniper는 후보를 넓게 보기 위해 낮게 유지
    final_conf: 0.001      # EVAL 모드: recall/FN을 보기 위해 낮게 유지
    merge_iou: 0.50

    # -------------------------------------------------------------------------
    # ROI / crop 관련
    # -------------------------------------------------------------------------
    roi_expansion: 1.75
    crop_size_lr: 64
    batch_size_sr: 32

    # -------------------------------------------------------------------------
    # ROI-aware hierarchical NMS 관련 (이번 실험의 핵심)
    # -------------------------------------------------------------------------
    scout_nms_iou: 0.50                 # Scout 결과를 1차 정리하는 IoU 기준
    roi_merge_iou: 0.30                 # uncertain Scout 박스들을 같은 ROI로 묶는 overlap 기준
    roi_center_ratio: 0.35              # IoU가 낮아도 중심이 가까우면 같은 ROI로 보는 보조 기준
    sniper_nms_iou: 0.45                # Sniper crop 내부 박스 정리 기준
    final_nms_iou: 0.50                 # 마지막 전체 결과 정리 기준
    drop_uncertain_if_sniper_hits: true # Sniper가 ROI에서 성공하면 해당 ROI의 uncertain Scout 박스 제거
    sniper_score_bonus: 0.0             # Sniper score에 추가 가산점 (처음엔 0.0 추천)

logging:
  save_dir: "results/arch4_roi_aware_eval"
