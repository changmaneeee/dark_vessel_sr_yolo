# =============================================================================
# Arch4 ROI-aware NMS Configuration (DEPLOY-LIKE MODE)
# ----------------------------------------------------------------------------
# 목적:
# - 실제 추론/운용에 가까운 설정
# - final_conf를 높여 false positive를 줄이고 cleaner output을 유도
# =============================================================================

data:
  hr_root: "/home/octolab/dark_vessel_sr_yolo/dataset/smart_airbus_data"
  hr_val_images: "images/val"
  hr_val_labels: "labels/val"

  lr_root: "/home/octolab/dark_vessel_sr_yolo/dataset/smart_airbus_data_lr"
  lr_val_images: "images/val"

  upscale_factor: 4

model:
  sr:
    type: "rfdn"
    weights: "/home/octolab/dark_vessel_sr_yolo/models/rfdn/model_best.pt"
    rfdn:
      nf: 50
      num_modules: 4

  yolo:
    weights_lr: "/home/octolab/dark_vessel_sr_yolo/models/yolo8s_lr/best.pt"
    weights_hr: "/home/octolab/dark_vessel_sr_yolo/models/sniper_ft_a11_e100/weights/best.pt"
    classes: 1

  arch4:
    pass1_conf: 0.0075
    high_conf: 0.45
    sniper_conf: 0.001
    final_conf: 0.25      # DEPLOY 모드 핵심: 최종 출력을 더 엄격하게 정리
    merge_iou: 0.50

    roi_expansion: 1.75
    crop_size_lr: 64
    batch_size_sr: 32

    scout_nms_iou: 0.50
    roi_merge_iou: 0.30
    roi_center_ratio: 0.35
    sniper_nms_iou: 0.45
    final_nms_iou: 0.50
    drop_uncertain_if_sniper_hits: true
    sniper_score_bonus: 0.0

logging:
  save_dir: "results/arch4_roi_aware_deploy"
