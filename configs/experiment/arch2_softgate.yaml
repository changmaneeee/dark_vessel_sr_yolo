# Architecture 2: Soft Gate Network

defaults:
  - ../default.yaml

data:
  hr_root: "/home/octolab/dark_vessel_sr_yolo/dataset/smart_airbus_data"
  hr_val_images: "/home/octolab/dark_vessel_sr_yolo/dataset/smart_airbus_data/images/val"
  lr_root: "/home/octolab/dark_vessel_sr_yolo/dataset/smart_airbus_data_lr"
  lr_val_images: "/home/octolab/dark_vessel_sr_yolo/dataset/smart_airbus_data_lr/images/val"
  scale_factor: 4
  upscale_factor: 4

experiment:
  name: "arch2_softgate"
  architecture: "arch2"

model:
  pipeline: "arch2_softgate"
  sr_type: "rfdn"
  
  # ★★★ RFDN 설정 ★★★
  rfdn:
    nf: 50
    num_modules: 4
    pretrain_path: "/home/octolab/dark_vessel_sr_yolo/models/rfdn/model_best.pt"
  
  # ★★★ YOLO 설정 ★★★
  yolo:
    weights_path: "/home/octolab/dark_vessel_sr_yolo/models/yolo_8s_rfdn/best.pt"
    num_classes: 1
  
  # ★★★ Gate 설정 ★★★
  gate:
    base_channels: 32
    num_layers: 4
    weights_path: "/home/octolab/dark_vessel_sr_yolo/models/arch2_gate/gate_best.pt"

training:
  epochs: 300
  batch_size: 8

losses:
  gate_regularization:
    type: "entropy"
    weight: 0.01

evaluation:
  analyze_gate_values: true
