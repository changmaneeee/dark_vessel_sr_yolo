# Architecture 0: Sequential Pipeline (Baseline)
# LR → SR → HR → Detection

defaults:
  - ../default.yaml

data:
  hr_root: "/home/octolab/dark_vessel_sr_yolo/dataset/smart_airbus_data"
  hr_val_images: "/home/octolab/dark_vessel_sr_yolo/dataset/smart_airbus_data/images/val"
  hr_val_labels: "/home/octolab/dark_vessel_sr_yolo/dataset/smart_airbus_data/labels/val"
  
  lr_root: "/home/octolab/dark_vessel_sr_yolo/dataset/smart_airbus_data_lr"
  lr_val_images: "/home/octolab/dark_vessel_sr_yolo/dataset/smart_airbus_data_lr/images/val"
  lr_val_labels: "/home/octolab/dark_vessel_sr_yolo/dataset/smart_airbus_data_lr/labels/val"
  
  scale_factor: 4

experiment:
  name: "arch0_sequential_baseline"
  description: "Sequential SR-then-Detect baseline"
  architecture: "arch0"

# Architecture 특화 설정
model:
  pipeline: "arch0_sequential"
  sr_model: "rfdn"
  detector: "yolov8n"

  # ★★★ Weights 경로 명시 ★★★
  weights:
    sr_model: "/home/octolab/dark_vessel_sr_yolo/models/rfdn/model_best.pt"
    detector: "/home/octolab/dark_vessel_sr_yolo/models/yolo_8s_rfdn/best.pt"

  # ★★★ SR 설정 (0-255 범위) ★★★
  sr_config:
    input_range: "0-255"
    nf: 50
    scale: 4

  # Sequential 특화 옵션
  arch0:
    detach_sr: true
    use_hr_gt: false

# Training strategy
training:
  phases:
    - name: "sr_only"
      epochs: 100
      freeze_detector: true
      loss_weights:
        sr_alpha: 1.0
        det_beta: 0.0

    - name: "detector_only"
      epochs: 150
      freeze_sr: true
      loss_weights:
        sr_alpha: 0.0
        det_beta: 1.0

    - name: "joint_finetune"
      epochs: 50
      freeze_sr: false
      freeze_detector: false
      loss_weights:
        sr_alpha: 0.3
        det_beta: 0.7

# Evaluation
evaluation:
  measure_sr_quality: true
  sr_metrics:
    - "PSNR"
    - "SSIM"
    - "LPIPS"

  detection_metrics:
    - "mAP@0.5"
    - "mAP@0.75"
    - "Recall"
    - "Precision"

expected_performance:
  pros:
    - "SR 품질 높음 (dedicated training)"
    - "구현 단순"
    - "각 모듈 독립적"

  cons:
    - "Latency 높음 (2-pass)"
    - "SR 오류가 Detection에 전파"
    - "메모리 사용량 큼 (HR 이미지 저장)"

