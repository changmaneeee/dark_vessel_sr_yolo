# AIS-SAT-PIPELINE 기본 설정

experiment:
  name: "ais-sat-baseline"
  seed: 42
  device: "cuda"
  log_dir: "logs"
  checkpoint_dir: "checkpoints"

# 모델 구성
model:
  sr_model: "rfdn"
  detector: "yolov8n"
  fusion_method: "attention"
  scale_factor: 4
  
  # Weights 경로
  weights:
    sr_model: "weights/rfdn/model_best.pt"
    detector: "weights/yolohr/8s/best.pt"
  
  # SR 모델 설정
  sr_config:
    input_range: "0-255"
    nf: 50
    scale: 4

# ★★★ 데이터 경로 (실제 경로) ★★★
data:
  # HR 데이터
  hr_root: "/home/changmin/smart_airbus_data"
  hr_train_images: "/home/changmin/smart_airbus_data/images/train"
  hr_train_labels: "/home/changmin/smart_airbus_data/labels/train"
  hr_val_images: "/home/changmin/smart_airbus_data/images/val"
  hr_val_labels: "/home/changmin/smart_airbus_data/labels/val"
  hr_data_yaml: "/home/changmin/smart_airbus_data/data.yaml"
  
  # LR 데이터
  lr_root: "/home/changmin/smart_airbus_data_lr"
  lr_train_images: "/home/changmin/smart_airbus_data_lr/images/train"
  lr_train_labels: "/home/changmin/smart_airbus_data_lr/labels/train"
  lr_val_images: "/home/changmin/smart_airbus_data_lr/images/val"
  lr_val_labels: "/home/changmin/smart_airbus_data_lr/labels/val"
  lr_data_yaml: "/home/changmin/smart_airbus_data_lr/data.yaml"
  
  # 이미지 크기
  hr_size: 768
  lr_size: 192
  scale_factor: 4

  # Augmentation
  augmentation:
    horizontal_flip: true
    vertical_flip: true
    rotate_90: true
    random_crop: true
    mosaic: false
    mixup: false

# 학습 설정
training:
  epochs: 300
  batch_size: 8
  num_workers: 4
  accumulation_steps: 1

  lr: 1.0e-4
  weight_decay: 0.01
  grad_clip: 1.0

  loss_weights:
    sr_alpha: 0.7
    det_beta: 0.3
    feature_gamma: 0.0

  phases:
    - name: "warmup"
      epochs: 50
      freeze_detector: true
      loss_weights:
        sr_alpha: 1.0
        det_beta: 0.0

    - name: "joint"
      epochs: 200
      freeze_detector: false
      loss_weights:
        sr_alpha: 0.7
        det_beta: 0.3

    - name: "finetune"
      epochs: 50
      freeze_sr: false
      loss_weights:
        sr_alpha: 0.3
        det_beta: 0.7

# Optimizer
optimizer:
  type: "AdamW"
  betas: [0.9, 0.999]
  eps: 1.0e-8

# Scheduler
scheduler:
  type: "CosineAnnealing"
  T_max: 300
  eta_min: 1.0e-6
  warmup_epochs: 10
  warmup_lr: 1.0e-6

# Detection 설정
detection:
  conf_threshold: 0.25
  iou_threshold: 0.45
  max_det: 300
  classes:
    - "ship"

# Evaluation
evaluation:
  metrics:
    - "mAP@0.5"
    - "mAP@0.5:0.95"
    - "Precision"
    - "Recall"
    - "F1"
    - "PSNR"
    - "SSIM"

  val_interval: 5
  save_best: true
  save_interval: 10

# Logging
logging:
  use_tensorboard: true
  use_wandb: false
  log_interval: 10
  visualize_samples: true
  num_vis_samples: 4

# Hardware
hardware:
  use_amp: true
  use_ddp: false
  num_gpus: 1